sentence=把 lilt 的弹簧手感 GUI 引擎移植成纯 C，跑在 ESP32-C3 + 0.96 寸 I2C OLED 上。
paragraph=单一动画原语（半隐式欧拉弹簧）、1 位页式帧缓冲、反色光标、逻辑按键 + 消抖连发。硬件只通过 ll_bus.h 一个接缝接触，同一份引擎代码在 PC 上无头录帧、在板子上推 I2C。动画语义和交互规则沿用 chhongzh/lilt（MIT），实现是重写的。
category=Display
